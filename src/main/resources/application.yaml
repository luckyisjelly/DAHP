spring:
  application:
    name: dahp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.dahp: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
