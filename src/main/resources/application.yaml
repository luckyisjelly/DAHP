spring:
  application:
    name: dahp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mail:
    host: ${DAHP_SMTP_HOST:smtp.gmail.com}
    port: ${DAHP_SMTP_PORT:587}
    username: ${DAHP_SMTP_USERNAME:}
    password: ${DAHP_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

dahp:
  jwt:
    secret: ${DAHP_JWT_SECRET:dahp-local-dev-secret-must-be-at-least-256-bits-long-do-not-use-in-prod}
    access-token-validity: ${DAHP_JWT_ACCESS_VALIDITY:PT1H}
    refresh-token-validity: ${DAHP_JWT_REFRESH_VALIDITY:P14D}
  handover:
    access-token-validity: ${DAHP_HANDOVER_TOKEN_VALIDITY:PT72H}
    evaluation-cron: ${DAHP_HANDOVER_EVAL_CRON:0 */1 * * * *}   # 1분마다 조건 평가
    expiry-cron: ${DAHP_HANDOVER_EXPIRY_CRON:0 */5 * * * *}     # 5분마다 만료 정리
  cors:
    allowed-origins: ${DAHP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend:
    base-url: ${DAHP_FRONTEND_BASE_URL:http://localhost:5173}
    access-path: ${DAHP_FRONTEND_ACCESS_PATH:/access}
  notification:
    email:
      enabled: ${DAHP_EMAIL_ENABLED:false}
      from: ${DAHP_EMAIL_FROM:noreply@dahp.local}
      from-name: ${DAHP_EMAIL_FROM_NAME:DAHP 알림}

logging:
  level:
    com.dahp: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
